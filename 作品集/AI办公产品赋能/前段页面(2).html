function bindReadSearch(){

<script id="kb-v7-final-fix-js">
(function(){
  function safeQ(s){return String(s||'').replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]})}
  function makeThread(q){
    var answer = (typeof qaAnswerText==='function') ? qaAnswerText(q) : '已根据知识库内容生成回答，并可继续追问或切换到数字阅读查看相关资料。';
    return '<div class="qa-thread">'
      + '<div class="qa-msg user"><b>我：</b>'+safeQ(q)+'</div>'
      + '<div class="qa-msg ai"><b>万策：</b>'+safeQ(answer)+'</div>'
      + '<div class="qa-context"><span>上下文</span>已恢复这条历史对话，你可以继续追问，或切换到数字阅读查看相关资料。</div>'
      + '</div>';
  }
  function patchKbQaHistory(){
    var ask=document.getElementById('kbQaAsk');
    var thread=document.getElementById('qaThread');
    var ans=document.getElementById('qaAnswer');
    document.querySelectorAll('[data-qa]').forEach(function(item){
      item.onclick=function(){
        document.querySelectorAll('[data-qa]').forEach(function(x){x.classList.remove('active')});
        item.classList.add('active');
        if(thread) thread.innerHTML=makeThread(item.dataset.qa||'');
        if(ans) ans.innerHTML='';
        if(ask) ask.value='';   // 关键：只恢复上下文，不把历史问题塞回输入框
      };
    });
    var newBtn=document.getElementById('newKbQa');
    if(newBtn){newBtn.onclick=function(){
      document.querySelectorAll('[data-qa]').forEach(function(x){x.classList.remove('active')});
      if(thread) thread.innerHTML='';
      if(ans) ans.innerHTML='';
      if(ask) ask.value='';
      if(typeof toast==='function') toast('已新建对话');
    }}
  }
  function patchReadSearch(){
    var input=document.getElementById('readSearchInput');
    var btn=document.getElementById('readSearchBtn');
    var matches=document.getElementById('searchMatches');
    var grid=document.getElementById('resourcesGrid');
    var filter=document.getElementById('resourceFilter');
    if(!input||!grid||!Array.isArray(window.books||books)) return;
    var data = window.books || books;
    function getRows(){
      var kw=(input.value||'').trim();
      var cat=(filter&&filter.value)||'全部';
      return data.filter(function(b){
        var inCat = cat==='全部' || b.tag===cat || String(b.title).indexOf(cat)>-1 || String(b.cover).indexOf(cat)>-1;
        var inKw = !kw || String(b.title).indexOf(kw)>-1 || String(b.cover).indexOf(kw)>-1 || String(b.tag).indexOf(kw)>-1 || String(b.page).indexOf(kw)>-1;
        return inCat && inKw;
      });
    }
    function card(b){ return (typeof resourceCardHtml==='function') ? resourceCardHtml(b) : '<div class="res-card" data-book="'+b.id+'"><div class="res-cover">'+safeQ(b.cover)+'</div><b>'+safeQ(b.title)+'</b><p>- <span style="float:right">页码：'+safeQ(b.page)+'</span></p></div>'; }
    function renderRows(rows){
      grid.innerHTML = rows.length ? rows.map(card).join('') : '<div class="empty-result">暂无匹配资源</div>';
      if(typeof bindResourceClicks==='function') bindResourceClicks();
    }
    function renderMatches(rows){
      var kw=(input.value||'').trim();
      if(!matches) return;
      if(!kw){matches.classList.remove('show');matches.innerHTML='';return;}
      if(!rows.length){matches.innerHTML='<div class="match-empty">没有找到匹配内容</div>';matches.classList.add('show');return;}
      matches.innerHTML=rows.slice(0,8).map(function(b){
        return '<div class="match-item" data-match="'+b.id+'"><div class="match-thumb">'+safeQ(String(b.cover||'文').slice(0,2))+'</div><div class="match-info"><b>'+safeQ(b.title)+'</b><span>'+safeQ(b.tag)+' · '+safeQ(b.page)+'页</span></div></div>'
      }).join('');
      matches.classList.add('show');
      matches.querySelectorAll('[data-match]').forEach(function(m){
        m.onclick=function(){ if(typeof renderBookDetail==='function') renderBookDetail(Number(m.dataset.match)); };
      });
    }
    function update(){ var rows=getRows(); renderRows(rows); renderMatches(rows); }
    input.oninput=update;
    input.onfocus=function(){ if(input.value.trim()) update(); };
    if(btn) btn.onclick=function(){ var rows=getRows(); renderRows(rows); renderMatches(rows); };
    if(filter) filter.onchange=function(){ var rows=getRows(); renderRows(rows); if(input.value.trim()) renderMatches(rows); };
    document.addEventListener('click',function(e){ if(matches && !e.target.closest('.read-search')) matches.classList.remove('show'); });
    renderRows(getRows());
  }
  function patchHamburger(){
    document.querySelectorAll('.kb-side .hamb').forEach(function(h){
      h.onclick=function(e){
        e.preventDefault(); e.stopPropagation();
        var wrap=h.closest('.kb-wrap'); if(wrap) wrap.classList.toggle('kb-collapsed');
      };
    });
  }
  function patchAfterKbPage(page){
    setTimeout(function(){
      patchHamburger();
      if(page==='qa') patchKbQaHistory();
      if(page==='read') patchReadSearch();
    },0);
  }
  var oldRenderKbTool = window.renderKbTool;
  if(typeof oldRenderKbTool==='function'){
    window.renderKbTool = renderKbTool = function(page){
      var ret = oldRenderKbTool(page);
      patchAfterKbPage(page);
      return ret;
    };
  }
  document.addEventListener('DOMContentLoaded',function(){patchHamburger();patchKbQaHistory();patchReadSearch();});
})();
</script>

(function(){

    var bookInput=q('#suggestBookV8'); if(bookInput && b) bookInput.value=b.title+' '+b.page+'页';
    q('#suggestTitleV8').value=''; q('#suggestContentV8').value=''; q('#suggestModuleV8').value='';

  }
  function closeSuggestModalV8(){var mask=q('#suggestMaskV8'); if(mask) mask.classList.remove('show')}
  ['#suggestCloseV8','#suggestCancelV8'].forEach(function(sel){document.addEventListener('click',function(e){if(e.target.closest(sel))closeSuggestModalV8();})});
  document.addEventListener('click',function(e){if(e.target.closest('#suggestOkV8')){closeSuggestModalV8(); if(typeof toast==='function')toast('已提交建议')}});

  function matchesBook(b,kw,cat){
    var text=[b.title,b.cover,b.tag,b.summary,b.page].join('');
    var okCat = !cat || cat==='全部' || b.tag===cat || text.indexOf(cat)>-1;
    if(!okCat) return false;
    if(!kw) return true;
    // 每输入一个字就匹配：完整包含或所有字分散包含都算匹配
    if(text.indexOf(kw)>-1) return true;

    if(typeof resourceCardHtml==='function') return resourceCardHtml(b);
    return '<div class="res-card" data-book="'+b.id+'"><div class="res-cover">'+esc(b.cover)+'</div><b>'+esc(b.title)+'</b><p>- <span style="float:right">页码：'+esc(b.page)+'</span></p></div>';
  }
  function attachBookClicks(scope){

    });
  }
  function forceReadSearch(){

      var kw=(input.value||'').trim();
      var cat=(filter&&filter.value)||'全部';
      var rows=data.filter(function(b){return matchesBook(b,kw,cat)});
      grid.innerHTML=rows.length?rows.map(buildResCard).join(''):'<div class="empty-result">暂无匹配资源</div>';
      attachBookClicks(grid);
      if(matches){
        if(kw&&showDrop){
          var sug=rows.slice(0,10);
          matches.innerHTML=sug.length?sug.map(function(b){
            return '<div class="match-item" data-match="'+b.id+'"><div class="match-thumb">'+esc(String(b.cover||'文').slice(0,2))+'</div><div class="match-info"><b>'+esc(b.title)+'</b><span>'+esc(b.tag)+' · '+esc(b.page)+'页</span></div><div class="match-open">打开</div></div>';
          }).join(''):'<div class="match-empty">没有找到匹配内容</div>';

        }else{matches.classList.remove('show');}
      }
    }
    input.oninput=function(){update(true)};
    input.onkeyup=function(){update(true)};
    input.oncompositionend=function(){update(true)};
    input.onfocus=function(){if(input.value.trim())update(true)};
    if(btn)btn.onclick=function(){update(true)};
    if(filter)filter.onchange=function(){update(!!input.value.trim())};
    document.addEventListener('click',function(e){if(matches&&!e.target.closest('.read-search'))matches.classList.remove('show')});
    update(false);

    if(typeof renderKbShell==='function') renderKbShell(content,'read');
    var back=q('#backRead'); if(back)back.onclick=function(){if(typeof renderKbTool==='function')renderKbTool('read')};
    var start=q('#startRead'); if(start)start.onclick=function(){if(typeof renderReader==='function')renderReader()};

      showShelfTip('已加入我的书架');
      add.textContent='已加入书架'; add.disabled=true; add.style.opacity='.7';

  function patchReaderSuggest(){

  }
  if(typeof renderReader==='function'){
    var oldReader=renderReader;
    window.renderReader=renderReader=function(){var ret=oldReader.apply(this,arguments);setTimeout(patchReaderSuggest,0);return ret;}
  }

      },30);

})();

      bindBookClicks(grid); $('#addFromRes').onclick=function(){renderKbTool('read')};
    }
    input.oninput=refreshShelf; if(btn)btn.onclick=refreshShelf; refreshShelf();
  };

  function renderDigitalReadFinal(){
    var bks=getBooks();
    var rank1=bks.slice(0,12).map(function(b){return '<p data-book="'+b.id+'">《'+esc(b.title)+'》</p>'}).join('');
    var rank2=bks.slice(2).concat(bks.slice(0,2)).map(function(b){return '<p data-book="'+b.id+'">《'+esc(b.title)+'》</p>'}).join('');
    var rank3=bks.slice().reverse().map(function(b){return '<p data-book="'+b.id+'">《'+esc(b.title)+'》</p>'}).join('');
    var content='<section class="read-page final-read-page"><button class="shelf-btn" id="shelfBtn">▥<br>我的书架</button><div class="read-search"><input id="readSearchInput" autocomplete="off" placeholder="请输入作者或书名"><button id="readSearchBtn">搜索</button><div id="readLiveMatches" class="search-matches"></div></div><div class="read-panel"><div class="recent-books">'+bks.slice(0,5).map(function(b){return '<div class="recent-book" data-book="'+b.id+'"><div class="cover">'+esc(b.cover)+'</div><div><b>《'+esc(b.title.slice(0,8))+'...》</b><br><span style="color:#0066b3">最近阅读</span></div></div>'}).join('')+'</div><div class="rank-row"><div class="rank"><h3>热门阅读榜</h3>'+rank1+'</div><div class="rank"><h3>热门问答榜</h3>'+rank2+'</div><div class="rank"><h3>新书速递</h3>'+rank3+'</div></div></div><div class="resource-box final-resource-box"><div class="resource-head"><h2>▣ 学术资源</h2><select id="resourceFilter"><option>全部</option><option>人工智能</option><option>法院</option><option>医院</option><option>世界</option><option>中国</option><option>各国</option></select></div><div class="resource-scroll"><div class="resources final-resources" id="resourcesGrid"></div></div></div></section>';
    renderKbShell(content,'read');
    $('#shelfBtn').onclick=renderShelf;
    bindDigitalSearchFinal();
  }
  function bindDigitalSearchFinal(){
    var input=$('#readSearchInput'), btn=$('#readSearchBtn'), grid=$('#resourcesGrid'), filter=$('#resourceFilter'), matches=$('#readLiveMatches');
    var bks=getBooks();
    function renderRows(rows){grid.innerHTML=rows.length?rows.map(finalCard).join(''):'<div class="empty-result">暂无匹配资源</div>';bindBookClicks(grid);}
    function update(showDrop){
      var kw=(input.value||'').trim();
      var cat=(filter.value||'全部');
      var rows=bks.filter(function(b){return bookMatches(b,kw,cat)});
      renderRows(rows);
      if(kw&&showDrop){
        var sug=rows.slice(0,10);
        matches.innerHTML=sug.length?sug.map(function(b){return '<div class="match-item" data-match="'+b.id+'"><div class="match-thumb">'+esc(String(b.cover||'文').slice(0,2))+'</div><div class="match-info"><b>'+esc(b.title)+'</b><span>'+esc(b.tag)+' · '+esc(b.page)+'页</span></div><div class="match-open">打开</div></div>'}).join(''):'<div class="match-empty">没有找到匹配内容</div>';
        matches.classList.add('show');
        matches.querySelectorAll('[data-match]').forEach(function(m){m.onclick=function(){renderBookDetail(Number(m.dataset.match));};});
      }else{matches.classList.remove('show');}
    }
    input.addEventListener('input',function(){update(true)});
    input.addEventListener('keyup',function(){update(true)});
    input.addEventListener('compositionend',function(){update(true)});
    input.addEventListener('focus',function(){if(input.value.trim())update(true)});
    btn.onclick=function(){update(true)};
    filter.onchange=function(){update(!!input.value.trim())};
    document.addEventListener('click',function(e){if(!e.target.closest('.read-search'))matches.classList.remove('show')});
    update(false);
  }

  var oldRenderKbTool = window.renderKbTool;
  window.renderKbTool = renderKbTool = function(page){
    if(page==='read'){renderDigitalReadFinal();return;}
    return oldRenderKbTool(page);
  };

  var oldRenderBookDetail = window.renderBookDetail;
  if(typeof oldRenderBookDetail==='function'){
    window.renderBookDetail = renderBookDetail = function(id){
      oldRenderBookDetail(id);
      setTimeout(function(){
        var add=$('#addShelf');
        if(add){
          add.onclick=function(){
            var b=getBooks().find(function(x){return String(x.id)===String(id)})||getBooks()[0];
            try{if(!shelf.some(function(x){return x.id===b.id}))shelf.push(b);}catch(e){}
            add.textContent='已加入书架';add.classList.add('added');add.disabled=true;
            showToast('已加入我的书架');
          };
        }
      },0);
    };
  }
})();
</script>


<script id="history-menu-script-override">
(function(){
  let activeHistMenuId = null;
  window.renderHistory = function(){
    const list = document.querySelector('#historyList');
    if(!list) return;
    list.innerHTML = orderedChats().map(c=>`<div class="chat-item hist-item ${c.id===currentChat?'active':''} ${c.pinned?'pinned':''} ${String(activeHistMenuId)===String(c.id)?'menu-open':''}" data-chat="${c.id}"><span class="dot">${c.pinned?'★':'✦'}</span><span class="hist-title">${c.title}</span><span class="hist-actions"><button class="hist-more-btn" type="button" data-hist-more="${c.id}" title="更多操作">…</button><div class="hist-dropdown"><button class="hist-menu-item" type="button" data-hist-menu-action="pin" data-id="${c.id}"><span class="mini-ico">📌</span><span>${c.pinned?'取消置顶':'置顶'}</span></button><button class="hist-menu-item" type="button" data-hist-menu-action="rename" data-id="${c.id}"><span class="mini-ico">✎</span><span>重命名</span></button><button class="hist-menu-item delete" type="button" data-hist-menu-action="delete" data-id="${c.id}"><span class="mini-ico">🗑</span><span>删除</span></button></div></span></div>`).join('');
  };

  document.addEventListener('click', function(e){
    const moreBtn = e.target.closest('[data-hist-more]');
    const menuItem = e.target.closest('[data-hist-menu-action]');
    if(moreBtn || menuItem){
      e.stopPropagation();
      e.preventDefault();
      e.stopImmediatePropagation();
      if(moreBtn){
        const id = moreBtn.getAttribute('data-hist-more');
        activeHistMenuId = (String(activeHistMenuId) === String(id)) ? null : id;
        renderHistory();
        return;
      }
      if(menuItem){
        const id = menuItem.getAttribute('data-id');
        const act = menuItem.getAttribute('data-hist-menu-action');
        activeHistMenuId = null;
        if(act==='pin') togglePinChat(id);
        if(act==='rename') renameChat(id);
        if(act==='delete') deleteChat(id);
        return;
      }
    }
    if(activeHistMenuId){
      const withinHistItem = e.target.closest('.hist-item');
      if(!withinHistItem || !withinHistItem.classList.contains('menu-open')){
        activeHistMenuId = null;
        renderHistory();
      }
    }
  }, true);

  // 初始化重新渲染一次，应用新结构
  if(typeof renderHistory === 'function'){
    activeHistMenuId = null;
    window.setTimeout(()=>{ try{ renderHistory(); }catch(e){} }, 0);
  }
})();
</script>

<script id="meeting-v14-final-js">
(function(){
  function q(sel){return document.querySelector(sel)}
  function qa(sel){return Array.from(document.querySelectorAll(sel))}
  function nowText(){
    var d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':00';
  }
  function fmtTime(v){
    if(!v)return nowText();
    if(v.indexOf('T')>-1){return v.replace('T',' ')+(v.length===16?':00':'')}
    return v;
  }
  function ensureMeetingData(){
    if(!window.mt){
      window.mt={tab:'mine',data:{mine:[],join:[],share:[],trash:[]}};
    }
    mt.data.mine=mt.data.mine||[];mt.data.join=mt.data.join||[];mt.data.share=mt.data.share||[];mt.data.trash=mt.data.trash||[];
  }
  function rowsForTab(){
    ensureMeetingData();
    if(mt.tab==='star') return mt.data.mine.filter(function(r){return r[5]}).concat(mt.data.join.filter(function(r){return r[5]}), mt.data.share.filter(function(r){return r[5]}));
    return mt.data[mt.tab]||[];
  }
  function findMeetByName(n){
    ensureMeetingData();
    for(var k in mt.data){
      var i=mt.data[k].findIndex(function(r){return r[0]===n});
      if(i>-1) return {k:k,i:i,row:mt.data[k][i]};
    }
    return null;
  }
  window.mtRows = rowsForTab;
  window.findMeet = findMeetByName;
  window.mActions=function(r){
    if(mt.tab==='trash'){
      return '<button class="icon-action delete" title="彻底删除" data-hard="'+encodeURIComponent(r[0])+'">🗑</button>';
    }
    return '<button class="icon-action '+(r[5]?'star-on':'')+'" title="收藏/取消收藏" data-star="'+encodeURIComponent(r[0])+'">★</button>'+
           '<button class="icon-action edit" title="修改别名" data-edit="'+encodeURIComponent(r[0])+'">✎</button>'+
           '<button class="icon-action delete" title="删除" data-del="'+encodeURIComponent(r[0])+'">🗑</button>';
  };
  function setErr(input,err,msg){var i=q(input),e=q(err);if(i)i.classList.add('invalid');if(e){e.textContent=msg;e.classList.add('show')}}
  function clearErr(input,err){var i=q(input),e=q(err);if(i)i.classList.remove('invalid');if(e){e.textContent='';e.classList.remove('show')}}
  window.openCreateMeetingModal=function(){
    modal('新建录音会议', '<div class="meet-form">'+
      '<div class="meet-form-row"><label class="required">会议名称</label><div class="meet-field"><input id="newMeetName" class="meet-input" placeholder="请输入会议名称"><div id="newMeetNameErr" class="meet-error"></div></div></div>'+
      '<div class="meet-form-row"><label class="required">会议时间</label><div class="meet-field"><input id="newMeetTime" class="meet-input" type="datetime-local"><div id="newMeetTimeErr" class="meet-error"></div></div></div>'+
      '<div class="meet-form-row"><label>参会人员</label><div class="meet-checks"><label><input type="checkbox" value="shengteng"> shengteng</label><label><input type="checkbox" value="胡欣宇"> 胡欣宇</label><label><input type="checkbox" value="周宸光"> 周宸光</label><label><input type="checkbox" value="ceshi"> ceshi</label></div></div>'+
      '<div class="meet-form-row"><label>会前资料</label><div class="meet-field"><button class="meet-file-btn" id="meetFileBtn" type="button">选择文件</button><span class="meet-file-name" id="meetFileName"></span><input type="file" id="meetFileInput" style="display:none"></div></div>'+
      '</div>', function(){
        clearErr('#newMeetName','#newMeetNameErr'); clearErr('#newMeetTime','#newMeetTimeErr');
        var name=q('#newMeetName').value.trim();
        var time=q('#newMeetTime').value;
        var ok=true;
        if(!name){setErr('#newMeetName','#newMeetNameErr','请输入会议名称');ok=false}
        if(!time){setErr('#newMeetTime','#newMeetTimeErr','请选择会议时间');ok=false}
        if(!ok)return false;
        var people=qa('.meet-checks input:checked').map(function(x){return x.value}).join(',');
        ensureMeetingData();
        mt.data.mine.unshift([name,people,'00:00',fmtTime(time),'super',false]);
        mt.tab='mine';
        if(typeof renderMeetTable==='function')renderMeetTable();
        qa('[data-meet-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-meet-tab')==='mine')});
        if(q('#meetSearch'))q('#meetSearch').value='';
        toast('录音会议已创建，并已加入我发起的');
      }, {className:'meeting-modal', okText:'提交'});
      var fileBtn=q('#meetFileBtn'), fileInput=q('#meetFileInput');
      if(fileBtn&&fileInput){fileBtn.onclick=function(){fileInput.click()}; fileInput.onchange=function(e){q('#meetFileName').textContent=(e.target.files[0]&&e.target.files[0].name)||''}}
      var n=q('#newMeetName'), t=q('#newMeetTime');
      if(n)n.oninput=function(){clearErr('#newMeetName','#newMeetNameErr')};
      if(t)t.oninput=function(){clearErr('#newMeetTime','#newMeetTimeErr')};
  };
  window.openUploadMeetingModal=function(){
    // 上传文件后直接加入我发起的；如果浏览器阻止文件框，则用弹窗兜底
    var file=document.createElement('input');
    file.type='file';
    file.accept='audio/*,video/*,.mp3,.wav,.m4a,.mp4,.txt,.doc,.docx,.pdf';
    file.style.display='none';
    document.body.appendChild(file);
    file.onchange=function(e){
      var f=e.target.files&&e.target.files[0];
      if(!f){document.body.removeChild(file);return;}
      ensureMeetingData();
      var title=f.name.replace(/\.[^.]+$/,'')||'上传录音';
      mt.data.mine.unshift([title,'','00:00',nowText(),'super',false]);
      mt.tab='mine';
      if(q('#meetSearch'))q('#meetSearch').value='';
      if(typeof renderMeetTable==='function')renderMeetTable();
      qa('[data-meet-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-meet-tab')==='mine')});
      toast('文件已上传，并已加入我发起的');
      document.body.removeChild(file);
    };
    file.click();
  };
  function openRenameModal(name){
    var f=findMeetByName(name); if(!f)return;
    modal('修改录音别名','<div class="meet-form"><div class="meet-form-row"><label class="required">录音名称</label><div class="meet-field"><input id="renameMeetInput" class="meet-input" value="'+String(f.row[0]).replace(/"/g,'&quot;')+'"><div id="renameMeetErr" class="meet-error"></div></div></div></div>', function(){
      clearErr('#renameMeetInput','#renameMeetErr');
      var v=q('#renameMeetInput').value.trim();
      if(!v){setErr('#renameMeetInput','#renameMeetErr','请输入录音名称');return false}
      f.row[0]=v;
      if(typeof renderMeetTable==='function')renderMeetTable();
      toast('别名已修改');
    },{className:'rename-modal',okText:'确定'});
    var i=q('#renameMeetInput'); if(i)i.oninput=function(){clearErr('#renameMeetInput','#renameMeetErr')};
  }
  window.renderMeetTable=function(){
    ensureMeetingData();
    var kw=(q('#meetSearch')&&q('#meetSearch').value||'').trim().toLowerCase();
    var rows=rowsForTab().filter(function(r){return !kw||String(r[0]).toLowerCase().indexOf(kw)>-1});
    if(q('#meetTitle')) q('#meetTitle').textContent=(window.mtTitle&&mtTitle[mt.tab])||'我发起的';
    if(q('#meetTotal')) q('#meetTotal').textContent='当前第1页，共'+rows.length+'条数据';
    var table=q('#meetTable'); if(!table)return;
    table.innerHTML='<thead><tr><th>序号</th><th>会议题目</th><th>参会人</th><th>时长</th><th>创建时间</th><th>创建人</th><th>操作</th></tr></thead><tbody>'+rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+r[0]+'</td><td>'+(r[1]||'')+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+mActions(r)+'</td></tr>'}).join('')+'</tbody>';
    table.onclick=function(e){
      var star=e.target.closest('[data-star]'), edit=e.target.closest('[data-edit]'), del=e.target.closest('[data-del]'), hard=e.target.closest('[data-hard]');
      if(star){var fs=findMeetByName(decodeURIComponent(star.getAttribute('data-star')));if(fs){fs.row[5]=!fs.row[5];renderMeetTable();toast(fs.row[5]?'收藏成功':'已取消收藏')}}
      if(edit){openRenameModal(decodeURIComponent(edit.getAttribute('data-edit')))}
      if(del){var fd=findMeetByName(decodeURIComponent(del.getAttribute('data-del')));if(fd){mt.data.trash.unshift(mt.data[fd.k].splice(fd.i,1)[0]);renderMeetTable();toast('已移入回收站')}}
      if(hard){var fh=findMeetByName(decodeURIComponent(hard.getAttribute('data-hard')));if(fh){mt.data[fh.k].splice(fh.i,1);renderMeetTable();toast('删除成功')}}
    };
  };
  window.bindMeeting=function(){
    var menu=q('#meetMenu');
    if(menu)menu.onclick=function(e){var b=e.target.closest('[data-meet-tab]');if(!b)return;mt.tab=b.getAttribute('data-meet-tab');qa('[data-meet-tab]').forEach(function(x){x.classList.remove('active')});b.classList.add('active');if(q('#meetSearch'))q('#meetSearch').value='';renderMeetTable()};
    var search=q('#meetSearch'); if(search)search.oninput=renderMeetTable;
    var start=q('#startRecordBtn'); if(start)start.onclick=openCreateMeetingModal;
    var upload=q('#uploadMeetingBtn'); if(upload)upload.onclick=openUploadMeetingModal;
  };
  window.renderMeeting=function(){
    if(q('#drawerTitle')) q('#drawerTitle').textContent='智会通';
    var drawer=q('#drawer'), body=q('#drawerBody');
    if(drawer)drawer.classList.add('open','wide');
    if(!body)return;
    body.innerHTML='<div class="meet-app"><aside class="meet-rail"><button class="rail-btn active">🎙</button><button class="rail-btn">▣</button><div style="flex:1"></div><button class="rail-btn">♙</button></aside><aside class="meet-side"><h1 class="meet-logo">智会通</h1><button class="meet-action black" id="startRecordBtn">🎙 开始录音</button><button class="meet-action" id="uploadMeetingBtn">⇧ 上传文件</button><nav class="meet-menu" id="meetMenu"><button class="active" data-meet-tab="mine">◉ 我发起的</button><button data-meet-tab="join">♧ 我参与的</button><button data-meet-tab="share">⌘ 共享内容</button><button data-meet-tab="star">☆ 星标收藏</button><button data-meet-tab="trash">▣ 回收站</button></nav></aside><main class="meet-main"><div class="meet-head"><h2 class="meet-title" id="meetTitle">我发起的</h2><input class="meet-search" id="meetSearch" placeholder="搜索会议标题..."></div><section class="meet-card"><table class="meet-table" id="meetTable"></table></section><footer class="meet-foot"><div id="meetTotal">当前第1页</div><div class="pager"><div class="page-size">10条/页⌄</div><span>‹</span><span class="page-current">1</span><span>2</span><span>›</span><span>前往</span><input class="page-input" value="1"><span>页</span></div></footer></main></div>';
    mt.tab='mine'; bindMeeting(); renderMeetTable();

})();
</script>

<script id="meeting-v15-repair-js">
(function(){
  function q(s){return document.querySelector(s)}
  function qa(s){return Array.from(document.querySelectorAll(s))}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function nowText(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':00'}
  function fmtTime(v){if(!v)return nowText();return v.indexOf('T')>-1?v.replace('T',' ')+(v.length===16?':00':''):v}
  function ensureData(){
    if(typeof mt==='undefined') return;
    mt.data=mt.data||{}; mt.data.mine=mt.data.mine||[]; mt.data.join=mt.data.join||[]; mt.data.share=mt.data.share||[]; mt.data.trash=mt.data.trash||[];
    if(!mt.data.mine.length){mt.data.mine=[['0524-销售例会','', '08:47','2026-05-24 15:09:49','super',false],['长录音','','54:09','2026-04-28 11:10:41','super',true],['测试','','26:16','2026-04-28 09:39:26','super',false],['ces','shengteng,胡欣宇,周宸光','54:28','2026-04-16 11:59:00','super',true]];}
    if(typeof mtTitle!=='undefined'){mtTitle.star='星标收藏'}
  }
  function currentRows(){
    ensureData();
    if(mt.tab==='star') return mt.data.mine.filter(function(r){return r[5]}).concat(mt.data.join.filter(function(r){return r[5]}),mt.data.share.filter(function(r){return r[5]}));
    return mt.data[mt.tab]||[];
  }
  function findRow(name){
    ensureData();
    for(var k in mt.data){var idx=mt.data[k].findIndex(function(r){return String(r[0])===String(name)});if(idx>-1)return {key:k,index:idx,row:mt.data[k][idx]};}
    return null;
  }
  function switchMine(){
    mt.tab='mine';
    qa('[data-meet-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-meet-tab')==='mine')});
    if(q('#meetSearch'))q('#meetSearch').value='';
    window.renderMeetTable();
  }
  window.mActions=function(r){
    var name=encodeURIComponent(r[0]);
    if(mt.tab==='trash') return '<div class="meet-op"><button class="op-btn op-del" title="彻底删除" data-hard="'+name+'">🗑</button></div>';
    return '<div class="meet-op">'+
      '<button class="op-btn op-star '+(r[5]?'star-on':'')+'" title="收藏/取消收藏" data-star="'+name+'">★</button>'+
      '<button class="op-btn op-edit" title="修改别名" data-edit="'+name+'"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7 16.5l1.3-4.7L17.7 2.4a1.5 1.5 0 0 1 2.1 0l1.8 1.8a1.5 1.5 0 0 1 0 2.1l-9.4 9.4L7.5 17c-.3.1-.6-.2-.5-.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>'+
      '<button class="op-btn op-del" title="删除" data-del="'+name+'">🗑</button>'+
    '</div>';
  };
  function setErr(input,err,msg){var i=q(input),e=q(err);if(i)i.classList.add('invalid');if(e){e.textContent=msg;e.classList.add('show')}}
  function clearErr(input,err){var i=q(input),e=q(err);if(i)i.classList.remove('invalid');if(e){e.textContent='';e.classList.remove('show')}}
  window.openCreateMeetingModal=function(){
    if(typeof modal!=='function')return;
    modal('新建录音会议','<div class="meet-form-v15">'+
      '<div class="row"><div class="label req">会议名称</div><div class="field"><input id="v15MeetName" type="text" placeholder="请输入会议名称"><div id="v15MeetNameErr" class="err"></div></div></div>'+
      '<div class="row"><div class="label req">会议时间</div><div class="field"><input id="v15MeetTime" type="datetime-local"><div id="v15MeetTimeErr" class="err"></div></div></div>'+
      '<div class="row"><div class="label">参会人员</div><div class="checks"><label><input type="checkbox" value="shengteng"> shengteng</label><label><input type="checkbox" value="胡欣宇"> 胡欣宇</label><label><input type="checkbox" value="周宸光"> 周宸光</label><label><input type="checkbox" value="ceshi"> ceshi</label></div></div>'+
      '<div class="row"><div class="label">会前资料</div><div class="field"><button type="button" class="file-btn" id="v15MeetFileBtn">选择文件</button><span id="v15MeetFileName" class="file-name"></span><input type="file" id="v15MeetFile" style="display:none"></div></div>'+
    '</div>',function(){
      clearErr('#v15MeetName','#v15MeetNameErr');clearErr('#v15MeetTime','#v15MeetTimeErr');
      var name=(q('#v15MeetName')&&q('#v15MeetName').value.trim())||'';
      var time=(q('#v15MeetTime')&&q('#v15MeetTime').value)||'';
      var ok=true;
      if(!name){setErr('#v15MeetName','#v15MeetNameErr','请输入会议名称');ok=false;}
      if(!time){setErr('#v15MeetTime','#v15MeetTimeErr','请选择会议时间');ok=false;}
      if(!ok)return false;
      var people=qa('.meet-form-v15 .checks input:checked').map(function(x){return x.value}).join(',');
      ensureData();
      mt.data.mine.unshift([name,people,'00:00',fmtTime(time),'super',false]);
      switchMine();
      if(typeof toast==='function')toast('录音会议已创建，并已加入我发起的');
    },{className:'meeting-modal-v15',okText:'提交'});
    setTimeout(function(){
      var fb=q('#v15MeetFileBtn'), fi=q('#v15MeetFile'), fn=q('#v15MeetFileName');
      if(fb&&fi){fb.onclick=function(){fi.click()};fi.onchange=function(e){var f=e.target.files&&e.target.files[0]; if(fn)fn.textContent=f?f.name:'';}}
      var n=q('#v15MeetName'),t=q('#v15MeetTime');
      if(n)n.oninput=function(){clearErr('#v15MeetName','#v15MeetNameErr')};
      if(t)t.oninput=function(){clearErr('#v15MeetTime','#v15MeetTimeErr')};
    },0);
  };
  window.openUploadMeetingModal=function(){
    var input=document.createElement('input'); input.type='file'; input.accept='audio/*,video/*,.mp3,.wav,.m4a,.mp4,.txt,.doc,.docx,.pdf'; input.style.display='none';
    document.body.appendChild(input);
    input.onchange=function(e){
      var f=e.target.files&&e.target.files[0];
      if(!f){document.body.removeChild(input);return;}
      ensureData();
      var title=(f.name||'上传录音').replace(/\.[^.]+$/,'');
      mt.data.mine.unshift([title,'','00:00',nowText(),'super',false]);
      switchMine();
      if(typeof toast==='function')toast('文件已上传，并已加入我发起的');
      document.body.removeChild(input);
    };
    input.click();
  };
  window.openRenameMeetingModalV15=function(name){
    var f=findRow(name); if(!f)return;
    modal('修改录音别名','<div class="meet-form-v15"><div class="row"><div class="label req">录音名称</div><div class="field"><input id="v15RenameMeet" type="text" value="'+esc(f.row[0])+'"><div id="v15RenameErr" class="err"></div></div></div></div>',function(){
      clearErr('#v15RenameMeet','#v15RenameErr');
      var v=(q('#v15RenameMeet')&&q('#v15RenameMeet').value.trim())||'';
      if(!v){setErr('#v15RenameMeet','#v15RenameErr','请输入录音名称');return false;}
      f.row[0]=v;
      window.renderMeetTable();
      if(typeof toast==='function')toast('别名已修改');
    },{className:'rename-meeting-v15',okText:'确定'});
    setTimeout(function(){var i=q('#v15RenameMeet'); if(i)i.oninput=function(){clearErr('#v15RenameMeet','#v15RenameErr')};},0);
  };
  window.renderMeetTable=function(){
    ensureData();
    var kw=((q('#meetSearch')&&q('#meetSearch').value)||'').trim().toLowerCase();
    var rows=currentRows().filter(function(r){return !kw||String(r[0]).toLowerCase().indexOf(kw)>-1;});
    if(q('#meetTitle'))q('#meetTitle').textContent=(typeof mtTitle!=='undefined'&&mtTitle[mt.tab])||'我发起的';
    if(q('#meetTotal'))q('#meetTotal').textContent='当前第1页，共'+rows.length+'条数据';
    var table=q('#meetTable'); if(!table)return;
    table.innerHTML='<thead><tr><th>序号</th><th>会议题目</th><th>参会人</th><th>时长</th><th>创建时间</th><th>创建人</th><th>操作</th></tr></thead><tbody>'+rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(r[0])+'</td><td>'+esc(r[1]||'')+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+esc(r[4])+'</td><td>'+window.mActions(r)+'</td></tr>';}).join('')+'</tbody>';
  };
  window.bindMeeting=function(){
    var menu=q('#meetMenu');
    if(menu)menu.onclick=function(e){var b=e.target.closest('[data-meet-tab]');if(!b)return;mt.tab=b.getAttribute('data-meet-tab');qa('[data-meet-tab]').forEach(function(x){x.classList.remove('active')});b.classList.add('active');if(q('#meetSearch'))q('#meetSearch').value='';window.renderMeetTable();};
    var search=q('#meetSearch'); if(search){search.oninput=window.renderMeetTable;search.onchange=window.renderMeetTable;}
    var start=q('#startRecordBtn'); if(start)start.onclick=window.openCreateMeetingModal;
    var upload=q('#uploadMeetingBtn'); if(upload)upload.onclick=window.openUploadMeetingModal;
    var table=q('#meetTable'); if(table){
      table.onclick=function(e){
        var star=e.target.closest('[data-star]'), edit=e.target.closest('[data-edit]'), del=e.target.closest('[data-del]'), hard=e.target.closest('[data-hard]');
        if(star){var fs=findRow(decodeURIComponent(star.getAttribute('data-star')));if(fs){fs.row[5]=!fs.row[5];window.renderMeetTable();if(typeof toast==='function')toast(fs.row[5]?'收藏成功':'已取消收藏');}}
        if(edit){window.openRenameMeetingModalV15(decodeURIComponent(edit.getAttribute('data-edit')));}
        if(del){var fd=findRow(decodeURIComponent(del.getAttribute('data-del')));if(fd){mt.data.trash.unshift(mt.data[fd.key].splice(fd.index,1)[0]);window.renderMeetTable();if(typeof toast==='function')toast('已移入回收站');}}
        if(hard){var fh=findRow(decodeURIComponent(hard.getAttribute('data-hard')));if(fh){mt.data[fh.key].splice(fh.index,1);window.renderMeetTable();if(typeof toast==='function')toast('删除成功');}}
      };
    }
  };
  window.renderMeeting=function(){
    var drawer=q('#drawer'), body=q('#drawerBody');
    if(q('#drawerTitle'))q('#drawerTitle').textContent='智会通';
    if(drawer)drawer.classList.add('open','wide');
    if(!body)return;
    body.innerHTML='<div class="meet-app"><aside class="meet-rail"><button class="rail-btn active">🎙</button><button class="rail-btn">▣</button><div style="flex:1"></div><button class="rail-btn">♙</button></aside><aside class="meet-side"><h1 class="meet-logo">智会通</h1><button class="meet-action black" id="startRecordBtn">🎙 开始录音</button><button class="meet-action" id="uploadMeetingBtn">⇧ 上传文件</button><nav class="meet-menu" id="meetMenu"><button class="active" data-meet-tab="mine">◉ 我发起的</button><button data-meet-tab="join">♧ 我参与的</button><button data-meet-tab="share">⌘ 共享内容</button><button data-meet-tab="star">☆ 星标收藏</button><button data-meet-tab="trash">▣ 回收站</button></nav></aside><main class="meet-main"><div class="meet-head"><h2 class="meet-title" id="meetTitle">我发起的</h2><input class="meet-search" id="meetSearch" placeholder="搜索会议标题..."></div><section class="meet-card"><table class="meet-table" id="meetTable"></table></section><footer class="meet-foot"><div id="meetTotal">当前第1页</div><div class="pager"><div class="page-size">10条/页⌄</div><span>‹</span><span class="page-current">1</span><span>2</span><span>›</span><span>前往</span><input class="page-input" value="1"><span>页</span></div></footer></main></div>';
    mt.tab='mine';
    window.bindMeeting();
    window.renderMeetTable();
  };
  // 兜底：无论旧代码有没有绑定，点击“开始录音”都立即弹出新建录音会议窗口。
  document.addEventListener('click',function(e){

  },true);
  // 如果当前已经停留在智会通页面，则立即重绘并补齐交互。
  setTimeout(function(){if(q('#meetTable')||q('#startRecordBtn')){window.bindMeeting();window.renderMeetTable();}},0);
})();

<script id="v17-meeting-search-fix">
(function(){
  function q(s,r){return (r||document).querySelector(s)}
  function qa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
  function ensureMeetingSearch(){
    var app=q('.meet-app'); if(!app) return;
    var head=q('.meet-head',app);
    var main=q('.meet-main',app);
    if(!head && main){
      head=document.createElement('div');
      head.className='meet-head';
      var title=document.createElement('h2');
      title.className='meet-title';
      title.id='meetTitle';
      var active=q('[data-meet-tab].active',app);
      var map={mine:'我发起的',join:'我参与的',share:'共享内容',star:'星标收藏',trash:'回收站'};
      title.textContent=map[active&&active.getAttribute('data-meet-tab')]||'我发起的';
      head.appendChild(title);
      main.insertBefore(head, main.firstChild);
    }
    if(head && !q('#meetSearch',app)){
      var input=document.createElement('input');
      input.className='meet-search';
      input.id='meetSearch';
      input.placeholder='搜索会议标题...';
      input.setAttribute('autocomplete','off');
      input.addEventListener('input',function(){
        if(typeof window.renderMeetTableV16==='function') window.renderMeetTableV16();
        else if(typeof window.renderMeetTable==='function') window.renderMeetTable();
      });
      head.appendChild(input);
    }
    var search=q('#meetSearch',app);
    if(search){
      search.style.setProperty('display','block','important');
      search.style.setProperty('visibility','visible','important');
      search.style.setProperty('opacity','1','important');
      search.oninput=function(){
        if(typeof window.renderMeetTableV16==='function') window.renderMeetTableV16();
        else if(typeof window.renderMeetTable==='function') window.renderMeetTable();
      };
    }
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('[data-meet-tab]')) setTimeout(ensureMeetingSearch,0);
  },true);
  var oldRender=window.renderMeetTableV16;
  if(typeof oldRender==='function'){
    window.renderMeetTableV16=function(){var r=oldRender.apply(this,arguments); ensureMeetingSearch(); return r;};
  }
  var oldMeeting=window.renderMeeting;
  if(typeof oldMeeting==='function'){
    window.renderMeeting=function(){var r=oldMeeting.apply(this,arguments); setTimeout(ensureMeetingSearch,0); return r;};
  }
  setInterval(ensureMeetingSearch,500);
  setTimeout(ensureMeetingSearch,0);
})();
</script>

<!-- v20 FINAL guard: prevent 智会通“新建录音会议”弹窗在主页面/关闭后残留或乱弹 -->
<script id="v20-meeting-modal-guard">
(function(){
  function qs(s,r){return (r||document).querySelector(s)}
  function qsa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
  function text(el){return (el&&el.textContent||'').trim()}
  function inMeetingPage(){
    var drawer=qs('#drawer');
    return !!(drawer && drawer.classList.contains('open') && qs('.meet-app',drawer));
  }
  function removeBadMeetingModals(){
    if(inMeetingPage()) return;
    qsa('.zy-backdrop').forEach(function(mask){
      var title=text(qs('.zy-head b',mask));
      if(title.indexOf('新建录音会议')>-1 || title.indexOf('修改录音别名')>-1){mask.remove();}
    });
    qsa('.modal-mask').forEach(function(mask){
      var title=text(qs('#modalTitle',mask)) || text(qs('.modal-title',mask));
      if(title.indexOf('新建录音会议')>-1 || title.indexOf('修改录音别名')>-1){mask.style.display='none';}
    });
  }

  var oldOpenCreate=window.openCreateMeetingModalV16;
  var oldOpenUpload=window.openUploadMeetingModalV16;

  window.openCreateMeetingModalV16=function(ev){
    if(ev){ev.preventDefault();ev.stopPropagation(); if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();}
    if(!inMeetingPage()){
      removeBadMeetingModals();
      return false;
    }
    if(typeof oldOpenCreate==='function') return oldOpenCreate.call(this,ev);
    return false;
  };
  window.openUploadMeetingModalV16=function(ev){
    if(ev){ev.preventDefault();ev.stopPropagation(); if(ev.stopImmediatePropagation)ev.stopImmediatePropagation();}
    if(!inMeetingPage()) return false;
    if(typeof oldOpenUpload==='function') return oldOpenUpload.call(this,ev);
    return false;
  };

  // 用 window 捕获阶段抢在旧 document 捕获事件前处理，避免旧代码先弹出主页面弹窗。
  window.addEventListener('click',function(e){
    var target=e.target;
    var closeDrawer=target && target.closest && target.closest('#closeDrawer');
    if(closeDrawer){
      qsa('.zy-backdrop').forEach(function(m){m.remove();});
      qsa('.modal-mask').forEach(function(m){m.style.display='none';});
      return;
    }
    var start=target && target.closest && target.closest('#startRecordBtn,[data-action="start-record"]');
    if(start){
      e.preventDefault();e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      if(inMeetingPage() && typeof oldOpenCreate==='function') oldOpenCreate.call(window,e);
      else removeBadMeetingModals();
      return false;
    }
  },true);

  // 点击任何弹窗关闭按钮后，清理智会通弹窗，防止回到主页面残留。
  window.addEventListener('click',function(e){
    var close=e.target && e.target.closest && e.target.closest('.zy-close,.mx,.modal-close,.modal-x');
    if(close){setTimeout(removeBadMeetingModals,0);}
  },true);

  // 兜底：只要不在智会通页面，所有“新建录音会议/修改录音别名”弹窗都会被清掉。
  var observer=new MutationObserver(function(){removeBadMeetingModals();});
  observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style']});
  setTimeout(removeBadMeetingModals,0);
})();
</script>

<script id="v24-meeting-audio-drag-regen-js">
(function(){
  function q(s,r){return (r||document).querySelector(s)}
  function qa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
  function say(t){if(typeof toast==='function')toast(t)}
  function makeWaves(n){
    var html='';
    for(var i=0;i<n;i++) html+='<i style="height:'+(12+(i*9%32))+'px"></i>';
    return html;
  }
  function enhanceAudioPlayer(){
    var bar=q('.v23-wavebar');
    if(!bar || bar.getAttribute('data-v24-audio')==='1') return;
    bar.setAttribute('data-v24-audio','1');
    bar.innerHTML='<div class="v24-audio-player">'+
      '<div class="v24-wave-row"><span class="v24-audio-time" id="v24CurrentTime">03:36</span><div class="v24-wave paused" id="v24Wave">'+makeWaves(160)+'</div><span class="v24-audio-time" style="text-align:right">08:47</span></div>'+
      '<div class="v24-control-row"><button class="v24-mini-audio-btn" type="button" id="v24Back5">↺</button><button class="v24-play-main" type="button" id="v24Play">▶</button><button class="v24-mini-audio-btn" type="button" id="v24Forward5">↻</button><span class="v24-audio-meta">♙ AI校对转写</span><button class="v24-speed" type="button" id="v24Speed" data-speed="1">1x</button></div>'+
      '</div>';
    var playing=false;
    var speeds=[0.5,1,1.5,2];
    var idx=1;
    q('#v24Play',bar).onclick=function(e){
      e.preventDefault();e.stopPropagation();
      playing=!playing;
      this.textContent=playing?'Ⅱ':'▶';
      var wave=q('#v24Wave',bar); if(wave)wave.classList.toggle('paused',!playing);
      say(playing?'开始播放':'已暂停播放');
    };
    q('#v24Speed',bar).onclick=function(e){
      e.preventDefault();e.stopPropagation();
      idx=(idx+1)%speeds.length;
      this.dataset.speed=String(speeds[idx]);
      this.textContent=speeds[idx]+'x';
      say('当前倍速：'+speeds[idx]+'x');
    };
    q('#v24Back5',bar).onclick=function(e){e.preventDefault();e.stopPropagation();say('已后退 5 秒')};
    q('#v24Forward5',bar).onclick=function(e){e.preventDefault();e.stopPropagation();say('已前进 5 秒')};
  }

  function enableDragFloat(){
    var btn=q('#v23ChatFloat');
    var panel=q('.v23-panel');
    if(!btn || !panel || btn.getAttribute('data-v24-drag')==='1') return;
    btn.setAttribute('data-v24-drag','1');
    var startX=0,startY=0,startLeft=0,startTop=0,moved=false,dragging=false;
    function down(e){
      if(e.button!==0) return;
      dragging=true;moved=false;
      btn.classList.add('v24-dragging');
      var pr=panel.getBoundingClientRect(), br=btn.getBoundingClientRect();
      startX=e.clientX;startY=e.clientY;startLeft=br.left-pr.left;startTop=br.top-pr.top;
      btn.style.left=startLeft+'px';btn.style.top=startTop+'px';btn.style.right='auto';btn.style.bottom='auto';
      document.addEventListener('mousemove',move,true);
      document.addEventListener('mouseup',up,true);
      e.preventDefault();
    }
    function move(e){
      if(!dragging) return;
      var dx=e.clientX-startX, dy=e.clientY-startY;
      if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
      var pr=panel.getBoundingClientRect();
      var x=Math.max(8,Math.min(pr.width-btn.offsetWidth-8,startLeft+dx));
      var y=Math.max(64,Math.min(pr.height-btn.offsetHeight-8,startTop+dy));
      btn.style.left=x+'px';btn.style.top=y+'px';
    }
    function up(){
      dragging=false;btn.classList.remove('v24-dragging');
      document.removeEventListener('mousemove',move,true);
      document.removeEventListener('mouseup',up,true);
      if(moved){btn.setAttribute('data-v24-just-dragged','1');setTimeout(function(){btn.removeAttribute('data-v24-just-dragged')},80)}
    }
    btn.addEventListener('mousedown',down,true);
    btn.addEventListener('click',function(e){
      if(btn.getAttribute('data-v24-just-dragged')==='1'){
        e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
      }
    },true);
  }

  function fixRegenPlacement(){
    var panel=q('.v23-panel');
    if(!panel) return;
    qa('.v23-regen',panel).forEach(function(btn){
      if(btn.parentElement!==panel){
        panel.appendChild(btn);
      }
    });
  }

  function enhanceDetail(){
    enhanceAudioPlayer();
    enableDragFloat();
    fixRegenPlacement();
  }

  document.addEventListener('click',function(e){
    if(e.target.closest('[data-v23-detail-tab]') || e.target.closest('[data-v23-open-meet]') || e.target.closest('#v23ChatFloat')){
      setTimeout(enhanceDetail,0);
      setTimeout(enhanceDetail,80);
    }
  },true);
  var obs=new MutationObserver(function(){enhanceDetail();});
  obs.observe(document.body,{childList:true,subtree:true});
  setInterval(enhanceDetail,600);
  setTimeout(enhanceDetail,0);
})();
</script>
