<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识助手 · 系统管理员</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-app:#f4f5f4;--bg-content:#fff;--bg-nav:#f2f3f2;
  --sel-blue:#eaf3ff;--sel-green:#dff3eb;--text-main:#00152f;--text-dark:#202322;
  --text-sec:#8b908d;--border:#e5e7e5;--border-blue:#d0e3f7;
  --shadow:0 2px 8px rgba(0,0,0,0.06);--shadow-lg:0 8px 24px rgba(0,0,0,0.12);
  --radius:8px;--radius-lg:12px;--radius-xl:18px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;
  --green-grad:linear-gradient(135deg,#2d8a5e,#1a6b47);
  --primary-blue:#1a6fd4;--danger-red:#e53e3e;--warn-orange:#ed8936;--success-green:#38a169;--purple:#7c3aed;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg-app);color:var(--text-main);font-size:14px;line-height:1.5}
button{cursor:pointer;font-family:inherit;border:none;outline:none;font-size:13px}
input,textarea,select{font-family:inherit;outline:none;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px}
input:focus,textarea:focus,select:focus{border-color:var(--primary-blue);box-shadow:0 0 0 2px rgba(26,111,212,0.1)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d4d8d4;border-radius:3px}

.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#f0e6ff 0%,#e8f0fe 50%,#dff3eb 100%);z-index:9999;display:flex;align-items:center;justify-content:center}
.login-overlay.hidden{display:none}
.login-card{background:var(--bg-content);border-radius:var(--radius-xl);padding:40px 36px;box-shadow:var(--shadow-lg);width:420px;max-width:90vw}
.login-card h2{font-size:24px;font-weight:700;color:var(--text-main);text-align:center;margin-bottom:4px}
.login-card .login-subtitle{font-size:12px;color:var(--text-sec);text-align:center;margin-bottom:24px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;font-weight:500;color:var(--text-dark);margin-bottom:4px}
.login-field input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px}
.login-btn{width:100%;padding:12px;border-radius:var(--radius);background:var(--purple);color:#fff;font-size:15px;font-weight:500;border:none;margin-top:8px}
.login-btn:hover{background:#6d28d9}
.login-hint{background:#f9faf9;border-radius:var(--radius);padding:10px 14px;margin-top:16px;font-size:11px;color:var(--text-sec);line-height:1.5;text-align:center}
.login-error{color:#e53e3e;font-size:12px;text-align:center;margin-top:8px;min-height:18px}

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--bg-nav);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#5b21b6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0}
.sidebar-title{font-size:15px;font-weight:600;color:var(--text-dark)}
.sidebar-subtitle{font-size:11px;color:var(--text-sec)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-group-title{font-size:11px;color:var(--text-sec);padding:12px 16px 6px;font-weight:500}
.sidebar-item{padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--text-dark);font-size:13px;transition:all 0.12s;border-left:3px solid transparent}
.sidebar-item:hover{background:#e8ece8}
.sidebar-item.active{background:var(--sel-blue);border-left-color:var(--purple);color:var(--purple);font-weight:500}
.sidebar-item-icon{font-size:16px;width:20px;text-align:center}
.sidebar-item-badge{background:var(--danger-red);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:auto}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.sidebar-footer button{width:100%;padding:8px;border-radius:var(--radius);background:transparent;color:var(--text-sec);font-size:12px;border:1px solid var(--border)}
.sidebar-footer button:hover{background:#f0f1f0;color:var(--text-dark)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-app)}
.main-header{padding:14px 24px;background:var(--bg-content);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.main-header h2{font-size:18px;font-weight:600}
.main-header .header-right{display:flex;align-items:center;gap:12px}
.main-header .user-info{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-sec)}
.main-header .btn-logout{padding:6px 14px;border-radius:var(--radius-lg);background:#fff5f5;color:var(--danger-red);border:1px solid #fed7d7;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.12s}
.main-header .btn-logout:hover{background:#fed7d7}
.main-content{flex:1;overflow-y:auto;padding:24px}

.admin-panel{display:none}
.admin-panel.active{display:block}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-content);border-radius:var(--radius-lg);padding:20px 24px;border:1px solid var(--border);transition:box-shadow 0.15s;border-left:3px solid var(--border)}
.stat-card:hover{box-shadow:var(--shadow)}
.stat-card-value{font-size:28px;font-weight:700;color:var(--text-main)}
.stat-card-label{font-size:13px;color:var(--text-sec);margin-top:4px}
.stat-card-sub{font-size:11px;color:var(--success-green);margin-top:4px}

.filter-bar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-bar select{padding:8px 14px;border-radius:var(--radius-lg);border:1px solid var(--border);font-size:13px;background:var(--bg-content);cursor:pointer;min-width:140px}
.filter-bar input{padding:8px 14px;border-radius:var(--radius-lg);border:1px solid var(--border);font-size:13px;flex:1;max-width:340px}
.filter-bar input[type="date"]{flex:0 0 150px;max-width:150px;color:var(--text-dark);background:var(--bg-content)}
.filter-bar input::placeholder{color:#c0c4c0}

.tab-group{display:flex;gap:0;margin-bottom:16px}
.tab-btn{padding:8px 20px;background:var(--bg-content);border:1px solid var(--border);font-size:13px;color:var(--text-sec);cursor:pointer;transition:all 0.12s}
.tab-btn:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.tab-btn:last-child{border-radius:0 var(--radius) var(--radius) 0}
.tab-btn:not(:first-child){margin-left:-1px}
.tab-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);z-index:1}

.data-table{background:var(--bg-content);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.data-table table{width:100%;border-collapse:collapse}
.data-table th{background:#f9faf9;padding:10px 16px;text-align:left;font-size:12px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td{padding:10px 16px;font-size:13px;color:var(--text-dark);border-bottom:1px solid #f0f1f0}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#f9faf9}

.btn{padding:7px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;transition:all 0.12s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary-blue);color:#fff}
.btn-primary:hover{background:#1557b0}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:#6d28d9}
.btn-success{background:#dff3eb;color:#1a6b47;border:1px solid #b0dcc8}
.btn-success:hover{background:#c8e6d4}
.btn-danger{background:#fff5f5;color:var(--danger-red);border:1px solid #fed7d7}
.btn-danger:hover{background:#fed7d7}
.btn-outline{background:var(--bg-content);color:var(--text-dark);border:1px solid var(--border)}
.btn-outline:hover{background:#f0f1f0}
.btn-sm{padding:4px 10px;font-size:12px}

.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-success{background:#dff3eb;color:#1a6b47}
.badge-warning{background:#fffaf0;color:var(--warn-orange)}
.badge-danger{background:#fff5f5;color:var(--danger-red)}
.badge-info{background:#e8f0fe;color:var(--primary-blue)}
.badge-purple{background:#f3e8ff;color:var(--purple)}

.section{margin-bottom:24px}
.section-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-sec)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:0.4}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.35);z-index:3000;display:none;align-items:center;justify-content:center}
.modal-overlay.visible{display:flex}
.modal{background:var(--bg-content);border-radius:var(--radius-lg);padding:24px;width:100%;max-width:600px;box-shadow:var(--shadow-lg);max-height:85vh;overflow-y:auto}
.modal h3{font-size:18px;font-weight:600;margin-bottom:16px}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:13px;font-weight:500;color:var(--text-dark);margin-bottom:4px}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px}
.modal-field textarea{resize:vertical;min-height:80px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.modal-actions button{padding:8px 20px;border-radius:var(--radius);font-size:14px}
.modal-cancel{background:transparent;color:var(--text-dark);border:1px solid var(--border)}
.modal-cancel:hover{background:#f0f1f0}
.modal-confirm{background:var(--purple);color:#fff;border:none}
.modal-confirm:hover{background:#6d28d9}
.modal-danger{background:var(--danger-red);color:#fff;border:none}
.modal-danger:hover{background:#c53030}

.preview-card{background:#f9faf9;border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.preview-card-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.preview-card-icon{font-size:24px}
.preview-card-title{font-size:15px;font-weight:600;color:var(--text-dark)}
.preview-card-meta{font-size:12px;color:var(--text-sec)}
.preview-card-desc{font-size:13px;color:var(--text-dark);line-height:1.5;margin-bottom:8px}
.preview-card-tags{display:flex;gap:6px;flex-wrap:wrap}
.preview-card-tag{background:#f0f1f0;color:var(--text-sec);padding:2px 8px;border-radius:10px;font-size:11px}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin:16px 0;padding:16px;background:#f9faf9;border-radius:var(--radius)}
.detail-item{display:flex;flex-direction:column;gap:2px}
.detail-item .detail-label{font-size:11px;color:var(--text-sec);font-weight:500}
.detail-item .detail-value{font-size:13px;color:var(--text-dark)}

.file-info-section{margin-bottom:16px}
.file-info-section h4{font-size:14px;font-weight:500;color:var(--text-dark);margin-bottom:8px;display:flex;align-items:center;gap:6px}

.reject-section{margin-top:16px;padding:16px;background:#fff5f5;border:1px solid #fed7d7;border-radius:var(--radius)}
.reject-section textarea{width:100%;border:1px solid #fed7d7;border-radius:var(--radius);padding:8px 12px;font-size:13px;resize:vertical;min-height:70px}
.reject-section textarea:focus{border-color:var(--danger-red);box-shadow:0 0 0 2px rgba(229,62,62,0.1)}
.reject-section-title{font-size:13px;font-weight:500;color:var(--danger-red);margin-bottom:8px}

.progress-bar{height:6px;background:#f0f1f0;border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;transition:width 0.3s}
.progress-fill.approved{background:var(--success-green)}
.progress-fill.pending{background:var(--warn-orange)}
.progress-fill.rejected{background:var(--danger-red)}

.toast-container{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:5000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#202322;color:#fff;padding:10px 24px;border-radius:var(--radius-lg);font-size:13px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity 0.25s}
.toast.show{opacity:1}

.audit-actions{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>🔧 系统管理员</h2>
    <p class="login-subtitle">知识助手 · 内容审核管理</p>
    <div class="login-field"><label>用户名</label><input type="text" id="loginUsername" placeholder="请输入管理员账号" value="admin"></div>
    <div class="login-field"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码" value="123456"></div>
    <button class="login-btn" id="loginBtn">登 录</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-hint">管理员账号: <b>admin</b> / 密码: <b>123456</b></div>
  </div>
</div>

<div class="app" id="appContainer">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">管</div>
      <div><div class="sidebar-title">系统管理员</div><div class="sidebar-subtitle">审核管理</div></div>
    </div>
    <div class="sidebar-nav" id="sidebarNav">
      <div class="sidebar-group-title">审核管理</div>
      <div class="sidebar-item active" data-panel="kbaudit">
        <span class="sidebar-item-icon">📚</span>共享知识库审核
        <span class="sidebar-item-badge" id="kbauditBadge">0</span>
      </div>
      <div class="sidebar-item" data-panel="discover">
        <span class="sidebar-item-icon">🔍</span>发现内容审核
        <span class="sidebar-item-badge" id="discoverBadge">0</span>
      </div>
    </div>
    <div class="sidebar-footer"></div>
  </div>

  <div class="main">
    <div class="main-header" id="mainHeader">
      <h2 id="panelTitle">📚 共享知识库审核</h2>
      <div class="header-right">
        <div class="user-info" id="userInfo"></div>
        <button class="btn-logout" onclick="logout()">退出登录</button>
      </div>
    </div>
    <div class="main-content" id="mainContent">

      <!-- Shared KB Audit Panel -->
      <div class="admin-panel active" id="panel-kbaudit">
        <div class="stats-grid" id="kbauditStats"></div>
        <div class="tab-group" id="kbauditTabs">
          <button class="tab-btn active" data-status="pending">待审核</button>
          <button class="tab-btn" data-status="approved">已通过</button>
          <button class="tab-btn" data-status="rejected">已拒绝</button>
        </div>
        <div class="filter-bar">
          <input type="text" id="kbauditSearch" placeholder="搜索文件名、上传者..." oninput="renderKBAudit()">
          <select id="kbauditKBFilter" onchange="renderKBAudit()">
            <option value="all">全部共享知识库</option>
          </select>
          <select id="kbauditTypeFilter" onchange="renderKBAudit()">
            <option value="all">全部类型</option>
          </select>
          <input type="date" id="kbauditStartDate" title="开始日期">
          <input type="date" id="kbauditEndDate" title="结束日期">
          <button class="btn btn-primary btn-sm" onclick="renderKBAudit()">查询</button>
        </div>
        <div class="data-table">
          <table>
            <thead><tr><th>文件名</th><th>文件类型</th><th>上传者</th><th>目标知识库</th><th>上传时间</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="kbauditTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Discover Content Audit Panel -->
      <div class="admin-panel" id="panel-discover">
        <div class="stats-grid" id="discoverStats"></div>
        <div class="tab-group" id="discoverTabs">
          <button class="tab-btn active" data-status="pending">待审核</button>
          <button class="tab-btn" data-status="approved">已发布</button>
          <button class="tab-btn" data-status="rejected">已驳回</button>
        </div>
        <div class="filter-bar">
          <input type="text" id="discoverSearch" placeholder="搜索标题、作者..." oninput="renderDiscover()">
          <select id="discoverCategoryFilter" onchange="renderDiscover()">
            <option value="all">全部类型</option>
          </select>
          <input type="date" id="discoverStartDate" title="开始日期">
          <input type="date" id="discoverEndDate" title="结束日期">
          <button class="btn btn-primary btn-sm" onclick="renderDiscover()">查询</button>
        </div>
        <div class="section">
          <div class="section-title">发现内容审核列表</div>
          <div id="discoverList"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<div class="toast-container" id="toastContainer"></div>

<script>
var $ = function(id) { return document.getElementById(id); };
var currentUser = null;
var currentPanel = 'kbaudit';
var kbAuditStatusFilter = 'pending';
var discoverStatusFilter = 'pending';

/* ==== Toast ==== */
function showToast(t) {
  var c = $('toastContainer');
  var d = document.createElement('div'); d.className='toast'; d.textContent=t;
  c.appendChild(d);
  requestAnimationFrame(function(){d.classList.add('show')});
  setTimeout(function(){d.classList.remove('show');setTimeout(function(){d.remove()},300)},2000);
}

function getNow() {
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ==== Data Load ==== */
function loadData() {
  try {
    var d = localStorage.getItem('kb_users');
    if (d) window.users = JSON.parse(d);
    var a = localStorage.getItem('kb_auditFiles');
    if (a) window.auditFiles = JSON.parse(a);
    var l = localStorage.getItem('kb_logs');
    if (l) window.logs = JSON.parse(l);
    var kb = localStorage.getItem('kb_knowledgeBases');
    if (kb) window.knowledgeBases = JSON.parse(kb);
    var dc = localStorage.getItem('kb_discoverContent');
    if (dc) window.discoverContent = JSON.parse(dc);
    var docs = localStorage.getItem('kb_documents');
    if (docs) window.documents = JSON.parse(docs);
  } catch(e) {}
  if (!window.users) window.users = [
    {username:'admin',password:'123456',role:'admin',displayName:'系统管理员',avatar:'\u2699',status:'active'},
    {username:'kbadmin',password:'123456',role:'kbadmin',displayName:'知识库管理员',avatar:'\ud83d\udcda',status:'active'},
    {username:'user',password:'123456',role:'user',displayName:'普通用户',avatar:'\ud83d\udc64',status:'active'},
    {username:'zhangsan',password:'123456',role:'user',displayName:'张三',avatar:'\ud83d\udc64',status:'active'},
    {username:'lisi',password:'123456',role:'kbadmin',displayName:'李四',avatar:'\ud83d\udcda',status:'active'}
  ];
  if (!window.knowledgeBases) window.knowledgeBases = [
    {name:'我的知识库',id:'my-knowledge',type:'personal'},
    {name:'团队知识库',id:'team-knowledge',type:'shared'},
    {name:'项目知识库',id:'project-knowledge',type:'shared'},
    {name:'技术规范库',id:'tech-spec',type:'shared'}
  ];
  if (!window.auditFiles) {
    var ids = ['af-1','af-2','af-3','af-4','af-5','af-6','af-7','af-8'];
    window.auditFiles = [
      {id:'af-1',name:'2026年度技术规划方案',uploader:'张三',targetKB:'team-knowledge',targetKBName:'团队知识库',time:'2026-06-28 14:30',status:'pending',type:'PDF',size:'2.4MB',description:'年度技术规划方案最终版'},
      {id:'af-2',name:'产品需求文档PRD_v2.1',uploader:'李四',targetKB:'project-knowledge',targetKBName:'项目知识库',time:'2026-06-28 11:15',status:'pending',type:'Word',size:'1.8MB',description:'Q3产品迭代需求文档'},
      {id:'af-3',name:'后端接口设计规范',uploader:'张三',targetKB:'tech-spec',targetKBName:'技术规范库',time:'2026-06-27 16:45',status:'pending',type:'Markdown',size:'256KB',description:'后端RESTful API设计规范'},

function normalizeAuditFileTypes() {
  var allowed = {PDF:true, Word:true, Excel:true, Markdown:true};
  var replacements = {
    'PPT': {type:'PDF', size:'2.6MB'},
    'ZIP': {type:'PDF', size:'1.7MB'},
    '图片': {type:'Word', size:'1.2MB'},
    'TXT': {type:'Markdown', size:'68KB'}
  };
  window.auditFiles = (window.auditFiles || []).map(function(item) {
    var replacement = replacements[item.type];
    if (replacement) {
      item.type = replacement.type;
      item.size = replacement.size || item.size;
    } else if (!allowed[item.type]) {
      item.type = 'Excel';
    }
    item.name = (item.name || '').replace(/\.(pptx?|zip|png|jpe?g|gif|webp|txt|pdf|docx?|xlsx?|md|csv)$/i, '');
    if (item.type === 'PDF' && /截图|图片|压缩|截图包/.test(item.name)) item.name = item.name.replace(/截图包|截图|图片|压缩包/g, '记录');
    if (item.type === 'Word' && /视觉稿|截图/.test(item.name)) item.name = item.name.replace(/视觉稿|截图/g, '说明');
    return item;
  });
}

function dateOnly(value) {
  return (value || '').split(' ')[0] || '';
}

function uniqueFieldOptions(items, getter) {
  var seen = {};
  var options = [];
  items.forEach(function(item) {
    var value = getter(item);
    if (!value || seen[value]) return;
    seen[value] = true;
    options.push({value:value,label:value});
  });
  options.sort(function(a,b){return String(a.label).localeCompare(String(b.label), 'zh-Hans-CN');});
  return options;
}

function refillSelect(id, allLabel, options) {
  var select = $(id);
  if (!select) return;
  var selected = select.value || 'all';
  select.innerHTML = '<option value="all">'+allLabel+'</option>';
  options.forEach(function(option) {
    select.innerHTML += '<option value="'+option.value+'">'+option.label+'</option>';
  });
  select.value = options.some(function(option){return option.value === selected;}) ? selected : 'all';
}

function doLogin() {
  var u = ($('loginUsername')?$('loginUsername').value.trim():'');
  var p = ($('loginPassword')?$('loginPassword').value.trim():'');
  var e = $('loginError'); if(e) e.textContent='';
  if (!u) { if(e) e.textContent='请输入用户名'; return; }
  if (!p) { if(e) e.textContent='请输入密码'; return; }
  var user = window.users.find(function(x){return x.username===u&&x.password===p;});
  if (!user) { if(e) e.textContent='用户名或密码错误'; return; }
  if (user.role !== 'admin') { if(e) e.textContent='仅系统管理员可登录此后台'; return; }
  if (user.status === 'disabled') { if(e) e.textContent='该账号已被禁用'; return; }
  currentUser = user;
  $('loginOverlay').classList.add('hidden');
  $('userInfo').innerHTML = '<span>'+user.displayName+'</span><span class="badge badge-purple">系统管理员</span>';
  addLog('登录', '系统管理员后台', '成功');
  switchPanel('kbaudit');
}

  currentUser = null;
  $('loginOverlay').classList.remove('hidden');

}

function renderKBAudit() {
  loadData();
  var search = ($('kbauditSearch')?$('kbauditSearch').value.trim().toLowerCase():'');
  var kbFilter = ($('kbauditKBFilter')?$('kbauditKBFilter').value:'all');
  var typeFilter = ($('kbauditTypeFilter')?$('kbauditTypeFilter').value:'all');
  var startDate = ($('kbauditStartDate')?$('kbauditStartDate').value:'');
  var endDate = ($('kbauditEndDate')?$('kbauditEndDate').value:'');

  refillSelect('kbauditKBFilter', '全部共享知识库', uniqueFieldOptions(window.auditFiles, function(a){return a.targetKBName || a.targetKB;}));
  refillSelect('kbauditTypeFilter', '全部类型', uniqueFieldOptions(window.auditFiles, function(a){return a.type;}));

  // Filter with multi-field search (name, uploader, time, type)
  var filtered = window.auditFiles.filter(function(a) {
    if (a.status !== kbAuditStatusFilter) return false;
    if (search) {
      var fields = [a.name,a.uploader];
      var match = false;
      for (var i=0;i<fields.length;i++) {
        if (fields[i]&&fields[i].toLowerCase().indexOf(search)>=0) { match=true; break; }
      }
      if (!match) return false;
    }
    if (kbFilter !== 'all' && (a.targetKBName || a.targetKB) !== kbFilter) return false;
    if (typeFilter !== 'all' && a.type !== typeFilter) return false;
    var itemDate = dateOnly(a.time);
    if (startDate && itemDate < startDate) return false;
    if (endDate && itemDate > endDate) return false;
    return true;
  });

  // Stats
  var pending = window.auditFiles.filter(function(a){return a.status==='pending'});
  var approved = window.auditFiles.filter(function(a){return a.status==='approved'});
  var rejected = window.auditFiles.filter(function(a){return a.status==='rejected'});
  $('kbauditStats').innerHTML =
    '<div class="stat-card" style="border-left-color:var(--warn-orange)"><div class="stat-card-value" style="color:var(--warn-orange)">'+pending.length+'</div><div class="stat-card-label">待审核</div></div>'+
    '<div class="stat-card" style="border-left-color:var(--success-green)"><div class="stat-card-value" style="color:var(--success-green)">'+approved.length+'</div><div class="stat-card-label">已通过</div></div>'+
    '<div class="stat-card" style="border-left-color:var(--danger-red)"><div class="stat-card-value" style="color:var(--danger-red)">'+rejected.length+'</div><div class="stat-card-label">已拒绝</div></div>'+
    '<div class="stat-card" style="border-left-color:var(--purple)"><div class="stat-card-value">'+window.auditFiles.length+'</div><div class="stat-card-label">总审核数</div>'+
    '<div class="stat-card-sub">通过率: '+(window.auditFiles.length>0?Math.round(approved.length/window.auditFiles.length*100):0)+'%</div></div>';

  // Table
  var tbody = $('kbauditTableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-sec);padding:40px"><div style="font-size:36px;margin-bottom:8px;opacity:0.4">📂</div>暂无数据</td></tr>';
  } else {
    var badgeMap = {pending:'<span class="badge badge-warning">待审核</span>',approved:'<span class="badge badge-success">已通过</span>',rejected:'<span class="badge badge-danger">已拒绝</span>'};
    var html = '';
    filtered.forEach(function(a) {
      html += '<tr><td style="font-weight:500">'+a.name+'</td><td>'+(a.type||'-')+'</td><td>'+(a.uploader||'-')+'</td><td>'+(a.targetKBName||a.targetKB||'-')+'</td><td>'+(a.time||'-')+'</td><td>'+(badgeMap[a.status]||'')+'</td><td><div class="audit-actions">';
      if (a.status === 'pending') {
        html += '<button class="btn btn-purple btn-sm" onclick="showHandleModal(\''+a.id+'\',\'kbaudit\')">📋 处理</button>';
      } else {
        html += '<button class="btn btn-outline btn-sm" onclick="showHandleModal(\''+a.id+'\',\'kbaudit\')">👁 查看</button>';
      }
      html += '</div></td></tr>';
    });
    tbody.innerHTML = html;
  }

  $('kbauditBadge').textContent = pending.length;
  $('kbauditBadge').style.display = pending.length > 0 ? '' : 'none';
}

  var af = window.auditFiles.find(function(a){return a.id===id;});
  if (!af) return;
  var isPending = af.status === 'pending';
  var html = '<h3>'+(isPending?'📋 处理审核':'👁 查看详情')+' — '+af.name+'</h3>';
  
  // File detail grid
  html += '<div class="detail-grid">';
  html += '<div class="detail-item"><div class="detail-label">文件名</div><div class="detail-value">'+af.name+'</div></div>';
  html += '<div class="detail-item"><div class="detail-label">文件类型</div><div class="detail-value">'+(af.type||'未知')+'</div></div>';
  html += '<div class="detail-item"><div class="detail-label">文件大小</div><div class="detail-value">'+(af.size||'-')+'</div></div>';
  html += '<div class="detail-item"><div class="detail-label">上传者</div><div class="detail-value">'+(af.uploader||'-')+'</div></div>';
  html += '<div class="detail-item"><div class="detail-label">目标知识库</div><div class="detail-value">'+(af.targetKBName||af.targetKB||'-')+'</div></div>';
  html += '<div class="detail-item"><div class="detail-label">上传时间</div><div class="detail-value">'+(af.time||'-')+'</div></div>';
  html += '<div class="detail-item"><div class="detail-label">当前状态</div><div class="detail-value">';
  if (af.status === 'pending') html += '<span class="badge badge-warning">待审核</span>';
  else if (af.status === 'approved') html += '<span class="badge badge-success">已通过</span>';
  else html += '<span class="badge badge-danger">已拒绝</span>';
  html += '</div></div>';
  if (af.approvedTime) html += '<div class="detail-item"><div class="detail-label">审核通过时间</div><div class="detail-value">'+af.approvedTime+'</div></div>';
  if (af.rejectedTime) html += '<div class="detail-item"><div class="detail-label">驳回时间</div><div class="detail-value">'+af.rejectedTime+'</div></div>';
  if (af.reason) html += '<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">驳回原因</div><div class="detail-value" style="color:var(--danger-red)">'+af.reason+'</div></div>';
  if (af.description) html += '<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">文件描述</div><div class="detail-value">'+af.description+'</div></div>';
  html += '</div>';

  // Reject reason section (only for pending)
  if (isPending) {
    html += '<div class="reject-section" id="rejectSection" style="display:none">';
    html += '<div class="reject-section-title">✏ 请填写审核不通过的原因</div>';
    html += '<textarea id="rejectReasonInput" placeholder="请输入拒绝原因..."></textarea>';
    html += '</div>';
  }

  // Actions
  html += '<div class="modal-actions">';
  html += '<button class="modal-cancel" onclick="hideModal()">关闭</button>';
  if (isPending) {
    html += '<button class="btn btn-sm btn-outline" id="showRejectBtn" style="margin-right:8px">❌ 审核不通过</button>';
    html += '<button class="modal-danger" id="rejectConfirmBtn" style="display:none">确认不通过</button>';
    html += '<button class="modal-confirm" id="approveBtn">✅ 审核通过</button>';
  }
  html += '</div>';

  showModal(html);

  if (isPending) {
    setTimeout(function(){
      var approveBtn = $('approveBtn');
      var showRejectBtn = $('showRejectBtn');
      if (approveBtn) {
        approveBtn.onclick = function() {
          approveKBAuditItem(id);
        };
      }
      if (showRejectBtn) {
        showRejectBtn.onclick = function() {
          var rs = $('rejectSection');
          var rb = $('showRejectBtn');
          var confirmBtn = $('rejectConfirmBtn');
          if (rs.style.display === 'none') {
            rs.style.display = 'block';
            rb.textContent = '✖ 取消不通过';
            rb.style.background = '#f0f1f0';
            if (confirmBtn) confirmBtn.style.display = '';
          } else {
            rs.style.display = 'none';
            rb.textContent = '❌ 审核不通过';
            rb.style.background = '';
            if (confirmBtn) confirmBtn.style.display = 'none';
            var ri = $('rejectReasonInput');
            if (ri) ri.value = '';
          }
        };
      }
      var rejectConfirmBtn = $('rejectConfirmBtn');
      if (rejectConfirmBtn) {
        rejectConfirmBtn.onclick = function() {
          rejectKBAuditItem(id);
        };
      }
    }, 0);
  }
}

function approveKBAuditItem(id) {
  var af = window.auditFiles.find(function(a){return a.id===id;});
  if (!af) return;
  af.status = 'approved';
  af.approvedTime = getNow();
  try {
    var docs = JSON.parse(localStorage.getItem('kb_documents')||'[]');
    docs.push({name:af.name,type:af.type||'文件',size:af.size||'-',time:getNow(),icon:'\ud83d\udcc4',kbId:af.targetKB});
    localStorage.setItem('kb_documents', JSON.stringify(docs));
  } catch(e) {}
  saveData();
  renderKBAudit();
  addLog('审核通过', af.name+' -> '+af.targetKB, '成功');
  showToast('已通过审核: '+af.name);
  hideModal();
}

function rejectKBAuditItem(id) {
  var af = window.auditFiles.find(function(a){return a.id===id;});
  if (!af) return;
  var reasonInput = $('rejectReasonInput');
  var reason = reasonInput ? reasonInput.value.trim() : '';
  if (!reason) { showToast('请填写审核不通过的原因'); return; }
  af.status = 'rejected';
  af.reason = reason;
  af.rejectedTime = getNow();
  saveData();
  renderKBAudit();
  addLog('审核拒绝', af.name, reason);
  showToast('已驳回: '+af.name);
  hideModal();
}

/* ======== DISCOVER CONTENT AUDIT ======== */
(function(){
  if ($('discoverTabs')) {
    $('discoverTabs').addEventListener('click', function(e) {
      if (e.target.classList.contains('tab-btn')) {
        document.querySelectorAll('#discoverTabs .tab-btn').forEach(function(b){b.classList.remove('active')});
        e.target.classList.add('active');
        discoverStatusFilter = e.target.dataset.status;
        renderDiscover();
      }
    });
  }
})();

function renderDiscover() {
  loadData();
  var search = ($('discoverSearch')?$('discoverSearch').value.trim().toLowerCase():'');
  var catFilter = ($('discoverCategoryFilter')?$('discoverCategoryFilter').value:'all');
  var startDate = ($('discoverStartDate')?$('discoverStartDate').value:'');
  var endDate = ($('discoverEndDate')?$('discoverEndDate').value:'');

  refillSelect('discoverCategoryFilter', '全部类型', uniqueFieldOptions(window.discoverContent, function(d){return d.category;}));

  var filtered = window.discoverContent.filter(function(d) {
    if (d.status !== discoverStatusFilter) return false;
    if (search) {
      var fields = [d.title,d.author];
      var match = false;
      for (var i=0;i<fields.length;i++) {
        if (fields[i]&&fields[i].toLowerCase().indexOf(search)>=0) { match=true; break; }
      }
      if (!match) return false;
    }
    if (catFilter !== 'all' && d.category !== catFilter) return false;
    var itemDate = dateOnly(d.time);
    if (startDate && itemDate < startDate) return false;
    if (endDate && itemDate > endDate) return false;
    return true;
  });

  var pending = window.discoverContent.filter(function(d){return d.status==='pending'});
  var approved = window.discoverContent.filter(function(d){return d.status==='approved'});
  var rejected = window.discoverContent.filter(function(d){return d.status==='rejected'});
  $('discoverStats').innerHTML =
    '<div class="stat-card" style="border-left-color:var(--warn-orange)"><div class="stat-card-value" style="color:var(--warn-orange)">'+pending.length+'</div><div class="stat-card-label">待审核</div></div>'+
    '<div class="stat-card" style="border-left-color:var(--success-green)"><div class="stat-card-value" style="color:var(--success-green)">'+approved.length+'</div><div class="stat-card-label">已发布</div></div>'+
    '<div class="stat-card" style="border-left-color:var(--danger-red)"><div class="stat-card-value" style="color:var(--danger-red)">'+rejected.length+'</div><div class="stat-card-label">已驳回</div></div>'+
    '<div class="stat-card" style="border-left-color:var(--purple)"><div class="stat-card-value">'+window.discoverContent.length+'</div><div class="stat-card-label">总内容数</div>'+
    '<div class="stat-card-sub">发布率: '+(window.discoverContent.length>0?Math.round(approved.length/window.discoverContent.length*100):0)+'%</div></div>';

  var list = $('discoverList');
  var badgeMap = {pending:'<span class="badge badge-warning">待审核</span>',approved:'<span class="badge badge-success">已发布</span>',rejected:'<span class="badge badge-danger">已驳回</span>'};
  var html = '<div class="data-table"><table><thead><tr><th>标题</th><th>类型</th><th>作者</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  if (filtered.length === 0) {
    html += '<tr><td colspan="6" style="text-align:center;color:var(--text-sec);padding:32px">暂无内容</td></tr>';
  } else {
    filtered.forEach(function(d) {
      html += '<tr><td style="font-weight:500">'+(d.title||'-')+'</td><td>'+(d.category||'-')+'</td><td>'+(d.author||'-')+'</td><td>'+(d.time||'-')+'</td><td>'+(badgeMap[d.status]||'')+'</td><td>';
      if (d.status === 'pending') {
        html += '<button class="btn btn-purple btn-sm" onclick="showHandleModal(\''+d.id+'\',\'discover\')">📋 处理</button>';
      } else {
        html += '<button class="btn btn-outline btn-sm" onclick="showHandleModal(\''+d.id+'\',\'discover\')">👁 查看</button>';
      }
      html += '</td></tr>';
    });
  }
  html += '</tbody></table></div>';
  list.innerHTML = html;

  $('discoverBadge').textContent = pending.length;
  $('discoverBadge').style.display = pending.length > 0 ? '' : 'none';
}

function showDiscoverHandleModal(id) {
  var dc = window.discoverContent.find(function(d){return d.id===id;});
  if (!dc) return;
  var isPending = dc.status === 'pending';
  var html = '<h3>'+(isPending?'📋 处理审核':'👁 查看详情')+' — '+dc.title+'</h3>';

  // Detail grid
  html += '<div class="detail-grid">';
  html += '<div class="detail-item"><div class="detail-label">标题</div><div class="detail-value">'+dc.title+'</div></div>';
  html += '<div class="detail-item"><div class="detail-label">作者</div><div class="detail-value">'+(dc.author||'-')+'</div></div>';
  html += '<div class="detail-item"><div class="detail-label">分类</div><div class="detail-value">'+(dc.category||'未分类')+'</div></div>';
  html += '<div class="detail-item"><div class="detail-label">提交时间</div><div class="detail-value">'+(dc.time||'-')+'</div></div>';
  html += '<div class="detail-item"><div class="detail-label">当前状态</div><div class="detail-value">';
  if (dc.status === 'pending') html += '<span class="badge badge-warning">待审核</span>';
  else if (dc.status === 'approved') html += '<span class="badge badge-success">已发布</span>';
  else html += '<span class="badge badge-danger">已驳回</span>';
  html += '</div></div>';
  if (dc.approvedTime) html += '<div class="detail-item"><div class="detail-label">发布时间</div><div class="detail-value">'+dc.approvedTime+'</div></div>';
  if (dc.rejectedTime) html += '<div class="detail-item"><div class="detail-label">驳回时间</div><div class="detail-value">'+dc.rejectedTime+'</div></div>';
  if (dc.reason) html += '<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">驳回原因</div><div class="detail-value" style="color:var(--danger-red)">'+dc.reason+'</div></div>';
  if (dc.tags && dc.tags.length>0) html += '<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">标签</div><div class="detail-value">'+dc.tags.join('、')+'</div></div>';
  html += '<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">内容描述</div><div class="detail-value">'+dc.description+'</div></div>';
  html += '</div>';

  if (isPending) {
    html += '<div class="reject-section" id="rejectSection" style="display:none">';
    html += '<div class="reject-section-title">✏ 请填写审核不通过的原因</div>';
    html += '<textarea id="rejectReasonInput" placeholder="请输入驳回原因..."></textarea>';
    html += '</div>';
  }

  html += '<div class="modal-actions">';
  html += '<button class="modal-cancel" onclick="hideModal()">关闭</button>';
  if (isPending) {
    html += '<button class="btn btn-sm btn-outline" id="showRejectBtn" style="margin-right:8px">❌ 审核不通过</button>';
    html += '<button class="modal-danger" id="rejectConfirmBtn" style="display:none">确认不通过</button>';
    html += '<button class="modal-confirm" id="approveBtn">✅ 审核通过</button>';
  }
  html += '</div>';

  showModal(html);

  if (isPending) {
    setTimeout(function(){
      var approveBtn = $('approveBtn');
      var showRejectBtn = $('showRejectBtn');
      if (approveBtn) {
        approveBtn.onclick = function() {
          approveDiscoverItem(id);
        };
      }
      if (showRejectBtn) {
        showRejectBtn.onclick = function() {
          var rs = $('rejectSection');
          var rb = $('showRejectBtn');
          var confirmBtn = $('rejectConfirmBtn');
          if (rs.style.display === 'none') {
            rs.style.display = 'block';
            rb.textContent = '✖ 取消不通过';
            rb.style.background = '#f0f1f0';
            if (confirmBtn) confirmBtn.style.display = '';
          } else {
            rs.style.display = 'none';
            rb.textContent = '❌ 审核不通过';
            rb.style.background = '';
            if (confirmBtn) confirmBtn.style.display = 'none';
            var ri = $('rejectReasonInput');
            if (ri) ri.value = '';
          }
        };
      }
      var rejectConfirmBtn = $('rejectConfirmBtn');
      if (rejectConfirmBtn) {
        rejectConfirmBtn.onclick = function() {
          rejectDiscoverItem(id);
        };
      }
    }, 0);
  }
}

function approveDiscoverItem(id) {
  var dc = window.discoverContent.find(function(d){return d.id===id;});
  if (!dc) return;
  dc.status = 'approved';
  dc.approvedTime = getNow();
  saveData();
  renderDiscover();
  addLog('通过发现内容', dc.title, '已发布');
  showToast('已发布: '+dc.title);
  hideModal();
}

function rejectDiscoverItem(id) {
  var dc = window.discoverContent.find(function(d){return d.id===id;});
  if (!dc) return;
  var reasonInput = $('rejectReasonInput');
  var reason = reasonInput ? reasonInput.value.trim() : '';
  if (!reason) { showToast('请填写驳回原因'); return; }
  dc.status = 'rejected';
  dc.reason = reason;
  dc.rejectedTime = getNow();
  saveData();
  renderDiscover();
  addLog('驳回发现内容', dc.title, reason);
  showToast('已驳回: '+dc.title);
  hideModal();
}

/* ==== Modal ==== */
function showModal(html) {
  $('modalContent').innerHTML = html;
  $('modalOverlay').classList.add('visible');
}
function hideModal() {
  $('modalOverlay').classList.remove('visible');
}
$('modalOverlay').addEventListener('click', function(e) {
  if (e.target === $('modalOverlay')) hideModal();
});

/* ==== Init ==== */
loadData();
$('loginOverlay').classList.remove('hidden');

setInterval(function() {
  if (currentUser && currentPanel === 'kbaudit') renderKBAudit();
  if (currentUser && currentPanel === 'discover') renderDiscover();
}, 30000);
</script>
